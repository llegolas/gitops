apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../../base/livekit/client/resources
patches:
  - target:
      kind: HTTPRoute
      name: livekit-client
    patch: |-
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: livekit-client
      spec:
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            namespace: envoy-gateway-system
            name: minikube-envoy
            sectionName: https-terminated
        hostnames:
          - livekit-client.minikube.home
