apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../../base/mediamtx/route/resources
patches:
  - target:
      kind: HTTPRoute
      name: mediamtx-hls
    patch: |-
      - op: replace
        path: /spec/parentRefs/0/name
        value: minikube-envoy
      - op: replace
        path: /spec/hostnames/0
        value: hls.minikube.home
  - target:
      kind: HTTPRoute
      name: mediamtx-webrtc
    patch: |-
      - op: replace
        path: /spec/parentRefs/0/name
        value: minikube-envoy
      - op: replace
        path: /spec/hostnames/0
        value: webrtc.minikube.home
