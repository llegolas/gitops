apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: livekit-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "16"
spec:
  project: home-lab
  source:
    chart: livekit-server
    repoURL: https://helm.livekit.io
    targetRevision: 1.9.0
    helm:
      releaseName: livekit-server
      valuesObject:
        podHostNetwork: false
        livekit:
          port: 7880
          log_level: info
          key_file: keys.yaml
          redis:
            address: livekit-redis:6379
          rtc:
            tcp_port: 7881
            port_range_start: 50000
            port_range_end: 60000
            use_external_ip: false
            stun_servers:
              - "TURN_HOST:3478"
            turn_servers:
              - host: TURN_HOST
                port: 3478
                protocol: udp
                username: user-1
                credential: pass-1
          turn:
            enabled: false
        storeKeysInSecret:
          enabled: true
          keys:
            access_token: f14df9af7fc9d6a2b9ccad082c96e8cd67fd9699
        turnLoadbalancer:
          enable: false
  destination:
    namespace: livekit
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
