apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit-rtsp-source
  namespace: livekit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: livekit-rtsp-source
  template:
    metadata:
      labels:
        app: livekit-rtsp-source
    spec:
      containers:
        # RTSP hub: ffmpeg has no server-side "serve for read" RTSP support
        # (only demuxer-side listen, for receiving a push), so a real RTSP
        # server is needed here. Default config only -- plain RTSP relay,
        # no WebRTC/RTMP/HLS involved; LiveKit remains the only WebRTC-facing
        # server. Independently testable, e.g.
        # `ffplay rtsp://<pod-ip>:8554/stream`.
        - name: mediamtx
          image: bluenviron/mediamtx:1.20.0
          ports:
            - containerPort: 8554
              protocol: TCP
        # Publishes a looping synthetic test pattern into mediamtx over RTSP.
        - name: rtsp-publisher
          image: jrottenberg/ffmpeg:8.1.2-ubuntu2404-amd64
          command: ["/bin/bash", "-c"]
          args:
            - |
              while true; do
                ffmpeg -re -f lavfi -i "testsrc=size=1280x720:rate=30" \
                  -f lavfi -i "sine=frequency=1000" \
                  -c:v libx264 -preset veryfast -tune zerolatency -pix_fmt yuv420p \
                  -c:a aac \
                  -rtsp_transport tcp -f rtsp rtsp://localhost:8554/stream
                sleep 2
              done
        # Relays the local RTSP stream into LiveKit via the RTMP ingress,
        # since LiveKit Ingress does not accept RTSP directly (only
        # RTMP/WHIP push, or HTTP-file/HLS pull). The push URL is created
        # out-of-band by examples/create-livekit-ingress.sh and stored in
        # the livekit-ingress-stream-key Secret.
        - name: rtmp-relay
          image: jrottenberg/ffmpeg:8.1.2-ubuntu2404-amd64
          command: ["/bin/bash", "-c"]
          args:
            - |
              while true; do
                if [ -s /secret/url ]; then
                  ffmpeg -re -rtsp_transport tcp -i rtsp://localhost:8554/stream \
                    -c copy -f flv "$(cat /secret/url)"
                fi
                sleep 5
              done
          volumeMounts:
            - name: stream-key
              mountPath: /secret
              readOnly: true
      volumes:
        - name: stream-key
          secret:
            secretName: livekit-ingress-stream-key
            optional: true
