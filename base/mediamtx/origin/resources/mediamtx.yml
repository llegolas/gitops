# Origin: the only instance publishers push to. RTSP only, cluster-internal;
# read replicas pull from here on demand, so each replica costs the origin a
# single reader per stream regardless of how many viewers it serves.
logLevel: info

rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]
rtmp: no
hls: no
webrtc: no
srt: no
moq: no

paths:
  all_others:
