apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediamtx-source
  namespace: mediamtx
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mediamtx-source
  template:
    metadata:
      labels:
        app: mediamtx-source
    spec:
      initContainers:
        # One-time download of the source clip into the PVC (skipped once the
        # transcoded file exists).
        - name: download
          image: curlimages/curl:8.16.0
          securityContext:
            runAsUser: 0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              [ -s /media/bbb.mkv ] && exit 0
              [ -s /media/src.mp4 ] || curl -fL --retry 5 -o /media/src.mp4.part "$SOURCE_URL"
              [ -s /media/src.mp4 ] || mv /media/src.mp4.part /media/src.mp4
          env:
            - name: SOURCE_URL
              value: https://download.blender.org/demo/movies/BBB/bbb_sunflower_1080p_30fps_normal.mp4
          volumeMounts:
            - name: media
              mountPath: /media
        # One-time transcode into something both HLS and WebRTC can carry,
        # since MediaMTX does not transcode: H264 without B-frames (WebRTC
        # can't handle them), fixed 2s GOP (aligned HLS segments), Opus audio
        # (WebRTC has no AAC). The publisher then loops it with -c copy.
        - name: transcode
          image: jrottenberg/ffmpeg:8.1.2-ubuntu2404-amd64
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              [ -s /media/bbb.mkv ] && exit 0
              ffmpeg -hide_banner -y -i /media/src.mp4 \
                -vf "scale=1280:-2,fps=30" \
                -c:v libx264 -preset veryfast -crf 23 -maxrate 3M -bufsize 6M \
                -pix_fmt yuv420p -bf 0 -g 60 -keyint_min 60 -sc_threshold 0 \
                -c:a libopus -b:a 128k -ar 48000 -ac 2 \
                -f matroska /media/bbb.mkv.part
              mv /media/bbb.mkv.part /media/bbb.mkv
              rm -f /media/src.mp4
          volumeMounts:
            - name: media
              mountPath: /media
      containers:
        # Loops the prepared clip into the origin as path "bbb".
        - name: bbb
          image: jrottenberg/ffmpeg:8.1.2-ubuntu2404-amd64
          command: ["/bin/bash", "-c"]
          args:
            - |
              while true; do
                ffmpeg -hide_banner -loglevel warning -re -stream_loop -1 -i /media/bbb.mkv \
                  -c copy -rtsp_transport tcp -f rtsp rtsp://mediamtx-origin:8554/bbb
                sleep 2
              done
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: media
              mountPath: /media
              readOnly: true
        # Synthetic test pattern as path "testsrc" -- needs no download and its
        # frame counter makes end-to-end latency easy to eyeball.
        - name: testsrc
          image: jrottenberg/ffmpeg:8.1.2-ubuntu2404-amd64
          command: ["/bin/bash", "-c"]
          args:
            - |
              while true; do
                ffmpeg -hide_banner -loglevel warning -re \
                  -f lavfi -i "testsrc=size=1280x720:rate=30" \
                  -f lavfi -i "sine=frequency=1000:sample_rate=48000" \
                  -c:v libx264 -preset veryfast -tune zerolatency -pix_fmt yuv420p \
                  -bf 0 -g 60 -keyint_min 60 -sc_threshold 0 \
                  -c:a libopus -b:a 64k -ac 2 \
                  -rtsp_transport tcp -f rtsp rtsp://mediamtx-origin:8554/testsrc
                sleep 2
              done
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: mediamtx-media
