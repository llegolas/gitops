# MediaMTX replica. All replicas are identical and each one has every stream
# (one path per camera, sourceOnDemand), so any replica can serve any stream:
# the replica a viewer lands on pulls that camera directly, and only while
# someone is watching. There is no origin.
logLevel: info

# Every WebRTC session start and every control-API call is decided by the
# mediamtx-token hook: WebRTC reads need a token for that exact path, API calls
# need the config service's credentials. HLS is CDN-only: CDN requests carry
# hlsCDNSecret and skip the hook, any other HLS read is denied by it.
authMethod: http
authHTTPAddress: http://mediamtx-token.mediamtx.svc.cluster.local:8080/auth
# The default also excludes `api`, which would leave the API -- including the
# camera source URLs and their credentials -- open to anyone in the cluster.
authHTTPExclude:
  - action: metrics
  - action: pprof

# Control API, used by the config service to program the streams on every pod
# through the headless mediamtx-replica-api Service. Changes made through it
# live in memory only: the config service reconciles new/restarted pods.
api: yes
apiAddress: :9997

# Loopback only: the runOnDemand ffmpeg of a WebRTC camera publishes its
# Opus-audio copy back into the path here. Not reachable from outside the pod.
rtsp: yes
rtspAddress: 127.0.0.1:8554
rtspTransports: [tcp]
rtmp: no
srt: no
moq: no

# HLS is served to a CDN only (CloudFront/Cloudflare; cdn-sim in the PoC).
# The CDN adds `Authorization: Bearer <hlsCDNSecret>` (MTX_HLSCDNSECRET env),
# which makes MediaMTX skip the cookie check and auth and send cacheable
# responses: segments max-age=3600, media playlist max-age=<segment duration>,
# multivariant playlist max-age=30. Envoy routes all requests of one camera to
# the same replica (consistent hash), since segments are per replica.
hls: yes
hlsAddress: :8888
# Non-low-latency: LL-HLS playlists are sent as no-cache.
hlsVariant: fmp4
# 30 x 6s = the last 3 minutes are kept (and seekable) per stream while it is
# being watched. Segments are cut on keyframes (2s GOP), so 6s is exact.
hlsSegmentDuration: 6s
hlsSegmentCount: 30
# The CDN keeps polling the playlist while anyone watches; 60s after the last
# request the muxer closes, and 10s later (sourceOnDemandCloseAfter) the camera
# is released.
hlsMuxerCloseAfter: 60s

webrtc: yes
webrtcAddress: :8889
# Media is relayed by STUNner straight to the pod IP, so a fixed port is kept
# and the STUNner UDPRoute only opens this port.
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: ""
webrtcIPsFromInterfaces: yes
# STUNner TURN server, handed to browsers only (via the WHEP Link header).
# url/username/password come from MTX_WEBRTCICESERVERS2_0_* env vars.
webrtcICEServers2:
  - clientOnly: yes

# Applies to every path, including the ones added through the API, so for an
# HLS camera the config service only has to set `source` (the camera's RTSP
# URL). WebRTC cameras are set up differently, see paths below.
pathDefaults:
  sourceOnDemand: yes
  rtspTransport: tcp

# Streams: WebRTC cameras are named <cabinet>/<camera>, HLS cameras
# hls/<cabinet>/<camera> (CDN requests skip auth, so the prefix is what keeps
# WebRTC cameras off the CDN: Envoy only routes /hls/... to HLS, and the token
# service refuses hls/ paths). CDN URLs are /hls/<cabinet>/<camera>/...
# In production the config service adds them through the API
# (POST /v3/config/paths/add/<name>). PoC: one camera of each kind, pulled
# from the camera simulator (base/camera-sim).
#
# WebRTC has no AAC and cameras rarely send Opus, and MediaMTX does not
# transcode. So a WebRTC camera is not a `source`: the path starts ffmpeg on
# demand (first viewer; stopped runOnDemandCloseAfter=10s after the last),
# which pulls the camera, copies the video, re-encodes the audio to Opus
# (no-op cost if there is no audio track) and publishes the result back into
# the same path over loopback RTSP. `sourceOnDemand: no` overrides
# pathDefaults, which MediaMTX rejects on a publisher path. HLS cameras keep a
# plain `source`: HLS carries AAC.
paths:
  cabinet1/camera1:
    sourceOnDemand: no
    runOnDemand: >-
      ffmpeg -hide_banner -loglevel warning
      -rtsp_transport tcp -i rtsp://camera-sim.mediamtx.svc.cluster.local:8554/bbb
      -map 0:v -map 0:a? -c:v copy -c:a libopus -b:a 64k -ar 48000
      -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:$RTSP_PORT/$MTX_PATH
    runOnDemandRestart: yes
  hls/cabinet1/camera2:
    source: rtsp://camera-sim.mediamtx.svc.cluster.local:8554/testsrc
