apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mediamtx-webrtc
  namespace: mediamtx
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: envoy-gateway-system
      name: GATEWAY_NAME
      sectionName: https-terminated
  hostnames:
    - webrtc.CLUSTER_DOMAIN
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: mediamtx-replica
          port: 8889
          weight: 1
      # Sticky to one replica: WHEP sessions (POST, then PATCH/DELETE) are per-replica.
      sessionPersistence:
        sessionName: mtx-webrtc
        type: Cookie
