apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediamtx-replica
  namespace: mediamtx
spec:
  selector:
    matchLabels:
      app: mediamtx-replica
  template:
    metadata:
      labels:
        app: mediamtx-replica
    spec:
      containers:
        - name: mediamtx
          # -ffmpeg variant: WebRTC paths run ffmpeg to re-encode audio to Opus.
          image: bluenviron/mediamtx:1.20.0-ffmpeg
          args: ["/config/mediamtx.yml"]
          env:
            - name: MTX_WEBRTCICESERVERS2_0_URL
              value: turn:TURN_HOST:30478?transport=udp
            - name: MTX_WEBRTCICESERVERS2_0_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mediamtx-turn-credentials
                  key: username
            - name: MTX_WEBRTCICESERVERS2_0_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mediamtx-turn-credentials
                  key: password
            # Shared with the CDN (examples/create-mediamtx-cdn-secret.sh).
            # Optional: without it CDN mode is off and all HLS is denied,
            # WebRTC keeps working.
            - name: MTX_HLSCDNSECRET
              valueFrom:
                secretKeyRef:
                  name: mediamtx-hls-cdn
                  key: secret
                  optional: true
            # Requests arrive through Envoy (and, for HLS, the CDN stand-in),
            # so the client IP is taken from X-Forwarded-For when the peer is in
            # these networks -- for logs and the auth hook's "ip". Only affects
            # reporting: no access decision uses the IP.
            - name: MTX_HLSTRUSTEDPROXIES
              value: POD_CIDR
            - name: MTX_WEBRTCTRUSTEDPROXIES
              value: POD_CIDR
          ports:
            - name: hls
              containerPort: 8888
              protocol: TCP
            - name: webrtc
              containerPort: 8889
              protocol: TCP
            - name: webrtc-udp
              containerPort: 8189
              protocol: UDP
            - name: api
              containerPort: 9997
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: webrtc
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: mediamtx-replica-config
