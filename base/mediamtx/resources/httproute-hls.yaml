# CDN origin for HLS (CloudFront/Cloudflare; cdn-sim in the PoC). Public CDN
# URLs are /<cabinet>/<camera>/...; they are mapped to the hls/ path prefix
# that only HLS cameras have, so WebRTC cameras can't be pulled through the
# CDN (CDN requests skip MediaMTX auth). No cookie stickiness: a Set-Cookie
# would stop CDNs from caching -- mediamtx-hls-by-stream pins each camera to
# one replica instead.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mediamtx-hls
  namespace: mediamtx
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: envoy-gateway-system
      name: GATEWAY_NAME
      sectionName: https-terminated
  hostnames:
    - hls.CLUSTER_DOMAIN
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /hls/
      backendRefs:
        - group: ""
          kind: Service
          name: mediamtx-replica
          port: 8888
          weight: 1
