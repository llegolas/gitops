# CDN origin for HLS (CloudFront/Cloudflare; cdn-sim in the PoC). Public CDN
# URLs are /hls/<cabinet>/<camera>/..., identical to the MediaMTX path names
# of HLS cameras, so no rewrite is needed and MediaMTX's own redirects stay
# valid. Only /hls/... is routed: CDN requests skip MediaMTX auth, so WebRTC
# cameras (<cabinet>/<camera>) must not be reachable here -- they get a 404
# from Envoy (which normalizes the path first, so /hls/../ can't escape).
# No cookie stickiness: a Set-Cookie would stop CDNs from caching --
# mediamtx-hls-by-stream pins each camera to one replica instead, keyed on the
# X-Mtx-Stream header the CDN adds.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mediamtx-hls
  namespace: mediamtx
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: envoy-gateway-system
      name: GATEWAY_NAME
      sectionName: https-terminated
  hostnames:
    - hls.CLUSTER_DOMAIN
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /hls
      backendRefs:
        - group: ""
          kind: Service
          name: mediamtx-replica
          port: 8888
          weight: 1
