apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mediamtx-replica
  namespace: mediamtx
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mediamtx-replica
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  # Every replica-count change moves ~1/N of the HLS cameras to another replica
  # (consistent hash), restarting their 3-minute window -- so scale down slowly.
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
