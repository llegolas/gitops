# Read replica: serves HLS and WebRTC to viewers, pulling each requested path
# from the origin on demand (https://mediamtx.org/docs/features/scalability).
# Envoy Gateway pins each viewer to one replica with a session cookie, since
# HLS muxers and WHEP sessions are local to the replica that created them.
logLevel: info

rtsp: no
rtmp: no
srt: no
moq: no

hls: yes
hlsAddress: :8888

webrtc: yes
webrtcAddress: :8889
# Unlike the upstream example (which empties this because an L4 LB sits in
# front), media is relayed by STUNner straight to the pod IP, so a fixed
# port is kept and the STUNner UDPRoute only opens this port.
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: ""
webrtcIPsFromInterfaces: yes
# STUNner TURN server, handed to browsers only (via the WHEP Link header).
# url/username/password come from MTX_WEBRTCICESERVERS2_0_* env vars.
webrtcICEServers2:
  - clientOnly: yes

paths:
  "~^(.+)$":
    source: rtsp://mediamtx-origin.mediamtx.svc.cluster.local:8554/$G1
    sourceOnDemand: yes
    rtspTransport: tcp
