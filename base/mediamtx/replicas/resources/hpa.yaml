apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mediamtx-replica
  namespace: mediamtx
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mediamtx-replica
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
